<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Console Menu Store</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10131a, #1b2130);
      display: grid;
      place-items: center;
    }

    .card {
      width: min(920px, 92vw);
      padding: 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.75);
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Console Menu Store</h1>
    <p>Здесь будет красивая страница проекта из GitHub Releases.</p>
  </main>
</body>
</html>
