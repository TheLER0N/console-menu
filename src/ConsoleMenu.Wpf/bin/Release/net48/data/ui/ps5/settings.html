<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>PS5 - Settings</title>
<style>
body { margin:0; min-height:100vh; font-family:Segoe UI,Arial; color:#fff; background:linear-gradient(135deg,#090D16,#1B2A47); }
.top { padding:18px 24px; font-size:24px; font-weight:600; color:#FFFFFF; }
.card { margin:0 24px 24px; padding:24px; border-radius:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); }
button, select { background:rgba(255,255,255,.16); color:#fff; border:0; padding:10px 14px; border-radius:10px; margin:0 8px 8px 0; cursor:pointer; }
img { border-radius:12px; }
</style>
</head>
<body>
<div class='top'>PS5 - Settings</div>
<div class='card'><p>Shell theme</p><select onchange='applyTheme(this.value)'><option value='ps5'>PS5</option><option value='ps4'>PS4</option></select><br><button onclick='send("home")'>Back</button></div>
<script>
function send(action, value) { if (window.chrome && chrome.webview) { chrome.webview.postMessage(JSON.stringify({ action: action, value: value || '' })); } }
function applyTheme(v) { send('setTheme', v); setTimeout(function () { location.href = 'settings.html?cmd=settheme&value=' + v; }, 300); }
var tm = location.search.match(/[?&]theme=(ps4|ps5)/); if (tm) { var sel = document.querySelector('select'); if (sel) sel.value = tm[1]; }
</script>
</body>
</html>
